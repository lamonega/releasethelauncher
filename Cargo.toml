[workspace]
members = [
    "crates/constants",
    "crates/core",
    "crates/auth",
    "crates/net",
    "crates/mods",
    "crates/launch",
    "crates/coordinator",
    "crates/ui",
]
resolver = "2"

[package]
name = "release-the-launcher"
version = "0.6.0"
edition = "2021"
description = "A minimal Minecraft launcher"
license = "MIT"

[[bin]]
name = "release-the-launcher"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dependencies]
release-the-launcher-core = { path = "crates/core" }
release-the-launcher-auth = { path = "crates/auth" }
release-the-launcher-net = { path = "crates/net" }
release-the-launcher-mods = { path = "crates/mods" }
release-the-launcher-launch = { path = "crates/launch" }
release-the-launcher-coordinator = { path = "crates/coordinator" }
release-the-launcher-ui = { path = "crates/ui" }
egui = "0.27"
eframe = "0.27"
egui_extras = { version = "0.27", features = ["all_loaders"] }
image = { version = "0.24", features = ["webp"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
