[package]
name = "release-the-launcher-auth"
version = "0.3.0"
edition = "2021"
description = "Account types, offline UUID, Microsoft OAuth"

[dependencies]
release-the-launcher-core = { path = "../core" }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v3", "v4"] }
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["full"] }
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
md-5 = "0.10"
