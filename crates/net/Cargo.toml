[package]
name = "release-the-launcher-net"
version = { workspace = true }
edition = "2021"
description = "HTTP downloads, caching, checksum validation"

[dependencies]
reqwest = { version = "0.12.28", features = ["stream"] }
sha2 = "0.10"
sha1 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "rt", "sync", "time", "macros"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
release-the-launcher-constants = { path = "../constants" }

