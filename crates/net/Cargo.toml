[package]
name = "release-the-launcher-net"
version = "0.4.1"
edition = "2021"
description = "HTTP downloads, caching, checksum validation"

[dependencies]
reqwest = { version = "0.11", features = ["stream"] }
sha2 = "0.10"
sha1 = "0.10"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
url = "2"
tokio-util = { version = "0.7", features = ["io"] }
hex = "0.4"
