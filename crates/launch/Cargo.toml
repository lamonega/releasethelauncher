[package]
name = "release-the-launcher-launch"
version = "0.6.0"
edition = "2021"
description = "Version resolution, dependency graph, Java launch"

[dependencies]
release-the-launcher-net = { path = "../net" }
release-the-launcher-constants = { path = "../constants" }
release-the-launcher-core = { path = "../core" }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "1"
zip = "0.6"
url = "2"
dirs = "5"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
