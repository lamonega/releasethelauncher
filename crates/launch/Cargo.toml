[package]
name = "release-the-launcher-launch"
version = { workspace = true }
edition = "2021"
description = "Version resolution, dependency graph, Java launch"

[dependencies]
release-the-launcher-net       = { path = "../net" }
release-the-launcher-constants = { path = "../constants" }
release-the-launcher-core      = { path = "../core" }
reqwest         = { workspace = true, features = ["json"] }
serde           = { workspace = true }
serde_json      = { workspace = true }
tokio           = { workspace = true }
thiserror       = { workspace = true }
zip             = { workspace = true }
tracing         = { workspace = true }
dirs            = { workspace = true }
url             = "2"
version-compare = "0.2"
quick-xml       = { version = "0.41", features = ["serialize"] }
sysinfo         = "0.39"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
