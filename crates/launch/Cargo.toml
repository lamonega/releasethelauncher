[package]
name = "release-the-launcher-launch"
version = "0.4.1"
edition = "2021"
description = "Version resolution, dependency graph, Java launch"

[dependencies]
release-the-launcher-core = { path = "../core" }
release-the-launcher-net = { path = "../net" }
release-the-launcher-auth = { path = "../auth" }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "1"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
zip = "0.6"
url = "2"
