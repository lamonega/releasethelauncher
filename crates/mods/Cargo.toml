[package]
name = "release-the-launcher-mods"
version = "0.4.1"
edition = "2021"
description = "Mod provider trait, Modrinth implementation"

[dependencies]
release-the-launcher-net = { path = "../net" }
release-the-launcher-core = { path = "../core" }
reqwest = { version = "0.11", features = ["stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "0.6"
async-trait = "0.1"
thiserror = "1"
sha2 = "0.10"
sha1 = "0.10"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
urlencoding = "2"
futures = "0.3"
hex = "0.4"
