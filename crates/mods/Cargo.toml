[package]
name = "release-the-launcher-mods"
version = { workspace = true }
edition = "2021"
description = "Mod provider trait, Modrinth implementation"

[dependencies]
reqwest = { version = "0.12.28", features = ["stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "8.6.0"
async-trait = "0.1"
thiserror = "2"
toml = "1"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
release-the-launcher-constants = { path = "../constants" }
release-the-launcher-core = { path = "../core" }
release-the-launcher-net = { path = "../net" }
