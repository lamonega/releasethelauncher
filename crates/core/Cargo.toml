[package]
name = "release-the-launcher-core"
version = "0.4.0"
edition = "2021"
description = "Instance model, filesystem, settings, archive extraction"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v3"] }
dirs = "5"
zip = "0.6"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
